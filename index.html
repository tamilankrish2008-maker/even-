<!-- LOOP CONDITIONS -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="container">

    </div>
    <script>
        for (let i = 1; i <= 10; i++) {
            if (i % 2 === 0) {
                document.getElementById("container").innerHTML += `${i}<br>${i}<br>`;
            } else {
                document.getElementById("container").innerHTML += `${i}<br>`;
            }
        }
    </script>
</body>
</html>
